name: Bug report
description: Report a reproducible problem with Threadmark
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: Do not include private conversations, credentials, cache contents, or sensitive paths. For security issues, see SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic text and isolated temporary directories where possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and relevant output
      description: Include OS, Python and SQLite versions, and Codex version if relevant. Redact private information.
